[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localbatch"
version = "0.4.0"
description = "Local AWS Batch emulator for integration testing"
requires-python = ">=3.7"
dependencies = [
    "fastapi>=0.100.0; python_version >= '3.8'",
    "fastapi>=0.95.2,<0.100.0; python_version < '3.8'",
    "uvicorn[standard]>=0.23.0; python_version >= '3.8'",
    "uvicorn[standard]>=0.17.0,<0.23.0; python_version < '3.8'",
    "docker>=6.0.0; python_version >= '3.8'",
    "docker>=5.0.0,<6.0.0; python_version < '3.8'",
    "click>=8.0.0",
]

[project.scripts]
localbatch = "localbatch.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "boto3>=1.28",
    "httpx>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/localbatch"]
